[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "jutsu._jutsu"
features = ["pyo3/extension-module"]

[project]
name = "jutsu"
version = "0.1.dev0"
description = "Jinja2 template engine with a Rust core (WIP port)."
requires-python = ">=3.10"
dependencies = ["MarkupSafe>=3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]
