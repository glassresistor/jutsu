[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "jutsu._jutsu"
features = ["pyo3/extension-module"]

[project]
name = "jutsu"
version = "0.1.dev0"
description = "Jinja2 template engine with a Rust core (WIP port)."
requires-python = ">=3.10"
dependencies = ["MarkupSafe>=3.0"]

[tool.pytest.ini_options]
# anyio < 4.16 imports the deprecated `_pytest.python.CallSpec2` alias from its
# pytest plugin, which `filterwarnings = error` turns into a hard crash under
# pytest >= 9.2.  Ignore that deprecation so old transitive copies of anyio
# (trio pulls it in) cannot break collection; drop this once trio pins the
# fixed anyio release.
filterwarnings = [
    "error",
    "ignore::pytest.PytestRemovedIn10Warning",
]
testpaths = ["tests"]
pythonpath = ["src"]
