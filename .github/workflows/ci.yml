name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build the rust core, run the cargo unit tests, then run the pytest suite
  # against the freshly compiled extension.
  rust-python:
    name: Python ${{ matrix.python-version }} + rust core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Upper bound follows pyo3 0.23, which supports up to CPython 3.13.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Python first: pyo3 needs to find the interpreter it is compiled against.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest trio markupsafe jinja2

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Build rust core
        run: cargo build --release --locked

      # pytest reads the package straight out of src/ (pythonpath = ["src"] in
      # pyproject.toml), so the built extension is dropped next to it rather than
      # installed as a wheel.  This also replaces the committed .so, which was
      # built for one specific CPython version, with one matching this job.
      - name: Install extension into src/jutsu
        run: cp target/release/lib_jutsu.so src/jutsu/_jutsu.so

      # Fail loudly instead of silently running the pure python fallback.
      - name: Check rust core is loaded
        run: python -c "from jutsu.rust_parse import has_rust_core; assert has_rust_core(), 'rust core not loaded'"

      - name: Python tests
        run: python -m pytest --color=yes

  # Same pytest suite without the rust core, to prove the pure python fallback
  # still works.  The rust-only test modules skip themselves when _jutsu is
  # missing, so this job should stay green on its own.
  python-only:
    name: Python ${{ matrix.python-version }} (pure python)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest trio markupsafe jinja2

      # Hide the compiled core committed in git so `from . import _jutsu` fails.
      - name: Remove rust core
        run: rm -f src/jutsu/_jutsu.so

      - name: Check rust core is absent
        run: python -c "from jutsu.rust_parse import has_rust_core; assert not has_rust_core(), 'rust core unexpectedly present'"

      - name: Python tests
        run: python -m pytest --color=yes
